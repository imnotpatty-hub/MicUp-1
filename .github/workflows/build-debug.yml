name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android
        uses: android-actions/setup-android@v4

      - name: Build
        run: ./gradlew assembleDebug

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: MicUp-APK
          path: app/build/outputs/apk/debug/app-debug.apk      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicUp-debug
          path: app/build/outputs/apk/debug/app-debug.apk          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicUp-debug
          path: app/build/outputs/apk/debug/app-debug.apk        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicUp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
